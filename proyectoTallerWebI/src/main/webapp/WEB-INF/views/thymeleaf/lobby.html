<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #1f1f1f;
        color: white;
        min-height: 100vh;
        padding: 20px;
    }

    /* CONTENEDOR PRINCIPAL */
    .contenedor {
        max-width: 1100px;
        margin: auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        display: grid;
        grid-template-columns: 1.1fr 2fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }

    .avanzar-fecha {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 10px;
        min-height: 90px;
    }

    .avanzar-fecha h1 {
        color: #b6ff00;
        font-size: 20px;
        margin-bottom: 15px;
    }

    .proxima-fecha {
        font-size: 12px;
        color: #ddd;
    }

    .proxima-fecha span {
        display: block;
        color: white;
        font-size: 14px;
        margin-top: 5px;
    }


    /* PARTIDO DESTACADO */

    .partido-destacado {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 10px;
        text-align: center;
    }

    .partido {
        margin-bottom: 10px;
    }

    .equipos {
        color: #b6ff00;
        font-weight: bold;
        font-size: 14px;
    }

    .fecha-hora {
        font-size: 10px;
        color: #ddd;
        margin-top: 4px;
    }


    /* INFORMACION DEL TORNEO */

    .info-torneo {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 12px;
        font-size: 12px;
        line-height: 2;
    }

    .info-torneo strong {
        color: white;
    }


    /* =========================
       CONTENIDO
    ========================= */

    .contenido {
        display: grid;
        grid-template-columns: 1fr 1.6fr 1fr;
        gap: 20px;
    }


    /* =========================
       FECHAS
    ========================= */

    .fechas {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 8px;
    }

    .fecha-card {
        background: #444;
        border-radius: 7px;
        padding: 12px;
        margin-bottom: 10px;
        min-height: 95px;
    }

    .fecha-card:last-child {
        margin-bottom: 0;
    }

    .fecha-card h3 {
        color: #b6ff00;
        text-align: center;
        font-size: 11px;
        margin-bottom: 10px;
    }

    .fecha-card .partido-mini {
        text-align: center;
        font-size: 9px;
        margin-bottom: 8px;
    }

    .fecha-card .equipos-mini {
        color: #b6ff00;
        font-weight: bold;
        font-size: 8px;
    }

    .fecha-card .fecha-mini {
        color: #ccc;
        font-size: 7px;
        margin-top: 3px;
    }


    /* =========================
       TABLA DE POSICIONES
    ========================= */

    .tabla-container {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        overflow: hidden;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
    }

    thead {
        background: #b6ff00;
        color: #222;
    }

    th {
        padding: 7px 4px;
        font-size: 10px;
    }

    td {
        padding: 8px 5px;
        text-align: center;
        border-bottom: 1px solid #555;
    }

    tbody tr {
        background: #444;
    }

    tbody tr:hover {
        background: #505050;
    }

    td.equipo {
        text-align: left;
        font-weight: bold;
    }

    .posicion {
        width: 30px;
    }


    /* =========================
       ESTADISTICAS
    ========================= */

    .estadisticas {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .estadistica-card {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        min-height: 150px;
        overflow: hidden;
    }

    .estadistica-titulo {
        background: #b6ff00;
        color: #222;
        padding: 7px;
        font-size: 11px;
        text-align: center;
    }

    .estadistica-contenido {
        padding: 15px;
        color: #ccc;
        font-size: 11px;
    }

    .estadistica-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .estadistica-item strong {
        color: white;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {

        body {
            padding: 10px;
        }

        .header {
            grid-template-columns: 1fr;
        }

        .contenido {
            grid-template-columns: 1fr;
        }

        .estadisticas {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
    }

    @media (max-width: 500px) {

        .estadisticas {
            grid-template-columns: 1fr;
        }

        table {
            font-size: 9px;
        }

        th {
            font-size: 8px;
        }

        td {
            padding: 6px 2px;
        }
    }

</style>
</head>

<body>

<div class="contenedor">

    <a href="resumen">
        <!-- AVANZAR FECHA -->
        <div class="avanzar-fecha">

            <h1>AVANZAR FECHA</h1>

            <div class="proxima-fecha">
                PRÓXIMA FECHA
                <span>Fecha 11</span>
            </div>

        </div>
    </a>
</div>
</body>
</html>
