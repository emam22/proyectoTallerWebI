<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png?v=2}"/>
    <title>Title</title>
</head>
<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #1f1f1f;
        color: white;
        min-height: 100vh;
        padding: 20px;
    }

    /* CONTENEDOR PRINCIPAL */
    .contenedor {
        max-width: 1100px;
        margin: auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        display: grid;
        grid-template-columns: 1.1fr 2fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }

    .avanzar-fecha {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 10px;
        min-height: 90px;
    }

    .avanzar-fecha h1 {
        color: #b6ff00;
        font-size: 20px;
        margin-bottom: 15px;
    }

    .proxima-fecha {
        font-size: 12px;
        color: #ddd;
    }

    .proxima-fecha span {
        display: block;
        color: white;
        font-size: 14px;
        margin-top: 5px;
    }


    /* PARTIDO DESTACADO */

    .partido-destacado {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 10px;
        text-align: center;
    }

    .partido {
        margin-bottom: 10px;
    }

    .equipos {
        color: #b6ff00;
        font-weight: bold;
        font-size: 14px;
    }

    .fecha-hora {
        font-size: 10px;
        color: #ddd;
        margin-top: 4px;
    }


    /* INFORMACION DEL TORNEO */

    .info-torneo {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 12px;
        font-size: 12px;
        line-height: 2;
    }

    .info-torneo strong {
        color: white;
    }


    /* =========================
       CONTENIDO
    ========================= */

    .contenido {
        display: grid;
        grid-template-columns: 1fr 1.6fr 1fr;
        gap: 20px;
    }


    /* =========================
       FECHAS
    ========================= */

    .fechas {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 8px;
    }

    .fecha-card {
        background: #444;
        border-radius: 7px;
        padding: 12px;
        margin-bottom: 10px;
        min-height: 95px;
    }

    .fecha-card:last-child {
        margin-bottom: 0;
    }

    .fecha-card h3 {
        color: #b6ff00;
        text-align: center;
        font-size: 11px;
        margin-bottom: 10px;
    }

    .fecha-card .partido-mini {
        text-align: center;
        font-size: 9px;
        margin-bottom: 8px;
    }

    .fecha-card .equipos-mini {
        color: #b6ff00;
        font-weight: bold;
        font-size: 8px;
    }

    .fecha-card .fecha-mini {
        color: #ccc;
        font-size: 7px;
        margin-top: 3px;
    }


    /* =========================
       TABLA DE POSICIONES
    ========================= */

    .tabla-container {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        overflow: hidden;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
    }

    thead {
        background: #b6ff00;
        color: #222;
    }

    th {
        padding: 7px 4px;
        font-size: 10px;
    }

    td {
        padding: 8px 5px;
        text-align: center;
        border-bottom: 1px solid #555;
    }

    tbody tr {
        background: #444;
    }

    tbody tr:hover {
        background: #505050;
    }

    td.equipo {
        text-align: left;
        font-weight: bold;
    }

    .posicion {
        width: 30px;
    }


    /* =========================
       SELECTOR DE METRICAS
    ========================= */

    .metricas-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0 18px;
    }

    .metricas-selector a {
        border: 2px solid #b6ff00;
        color: #b6ff00;
        background: #2c2c2c;
        border-radius: 7px;
        padding: 7px 13px;
        font-size: 12px;
        font-weight: bold;
        text-decoration: none;
    }

    .metricas-selector a:hover {
        background: #d9ff66;
        color: #222;
    }

    .metricas-selector a.activa {
        background: #b6ff00;
        color: #222;
    }

    td.vacio {
        padding: 22px;
        color: #ccc;
        font-size: 13px;
    }


    /* =========================
       ESTADISTICAS
    ========================= */

    .estadisticas {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .estadistica-card {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        min-height: 150px;
        overflow: hidden;
    }

    .estadistica-titulo {
        background: #b6ff00;
        color: #222;
        padding: 7px;
        font-size: 11px;
        text-align: center;
    }

    .estadistica-contenido {
        padding: 15px;
        color: #ccc;
        font-size: 11px;
    }

    .estadistica-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .estadistica-item strong {
        color: white;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {

        body {
            padding: 10px;
        }

        .header {
            grid-template-columns: 1fr;
        }

        .contenido {
            grid-template-columns: 1fr;
        }

        .estadisticas {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
    }

    @media (max-width: 500px) {

        .estadisticas {
            grid-template-columns: 1fr;
        }

        table {
            font-size: 9px;
        }

        th {
            font-size: 8px;
        }

        td {
            padding: 6px 2px;
        }
    }

</style>
</head>

<body>

<div class="contenedor">

    <h1> ESTADISTICAS DE EQUIPOS</h1>

    <!-- SELECTOR DE ESTADISTICA (por defecto: Puntos) -->
    <div class="metricas-selector">
        <a th:each="metrica : ${metricas}"
           th:href="@{/estadisticasDeEquipos(metrica=${metrica.key}, idTorneo=${idTorneo})}"
           th:classappend="${metrica.key == metricaActual} ? 'activa'"
           th:text="${metrica.value}">Puntos</a>
    </div>

    <!-- RANKING DE EQUIPOS -->
    <div class="tabla-container">
        <table>
            <thead>
            <tr>
                <th>POS</th>
                <th>EQUIPO</th>
                <th>PARTIDOS JUGADOS</th>
                <th th:text="${metricaActualTitulo}">PUNTOS</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="fila : ${ranking}">
                <td th:text="${fila.posicion}">1</td>
                <td class="equipo" th:text="${fila.nombreEquipo}">Equipo</td>
                <td th:text="${fila.partidosJugados}">0</td>
                <td th:text="${fila.valor}">0</td>
            </tr>
            <tr th:if="${#lists.isEmpty(ranking)}">
                <td class="vacio" colspan="4">
                    No hay equipos inscriptos todavia en este torneo.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <br/>

    <a th:href="@{/lobby}">
        <div class="avanzar-fecha">

            <h1>VOLVER AL INICIO</h1>

        </div>
    </a>
</div>
<!-- LOGO DE MARCA -->
<img class="logo-marca" th:src="@{/img/isotipo.png?v=2}" alt="System TOR"/>

<!-- MENÚ DE USUARIO -->
<div class="menu-usuario">
    <button type="button" class="btn-menu-hamburguesa" id="btnMenuUsuario" aria-label="Abrir menú">
        <span></span>
        <span></span>
    </button>
    <div class="menu-usuario-opciones" id="menuUsuarioOpciones">
        <a th:href="@{/logout}">Cerrar sesión</a>
    </div>
</div>
<script th:src="@{/js/menu.js}"></script>

</body>
</html>
