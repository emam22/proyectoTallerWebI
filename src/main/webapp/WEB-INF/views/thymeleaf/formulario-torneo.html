<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Torneo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #1f1f1f;
            color: white;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTENEDOR PRINCIPAL DEL FORMULARIO */
        .form-card {
            width: 100%;
            max-width: 850px;
            background: #444444;
            border: 2px solid #b6ff00;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* ENCABEZADO */
        .form-header {
            background: #b6ff00;
            color: #111;
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* CUERPO DEL FORMULARIO */
        .form-body {
            padding: 25px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 40px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
            color: #efefef;
        }

        /* INPUTS DE TEXTO Y NÚMEROS */
        .input-text {
            background: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            color: #333;
            outline: none;
            width: 210px;
        }

        .input-short {
            width: 100px;
            text-align: center;
        }

        /* RADIO BUTTON / CHECKBOX CUSTOM */
        .checkbox-custom {
            width: 22px;
            height: 22px;
            accent-color: #b6ff00;
            cursor: pointer;
        }

        /* BOTONES */
        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-blanco {
            background: white;
            color: #111;
        }

        .btn-verde {
            background: #b6ff00;
            color: #111;
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            .grid-inputs {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .form-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .input-text, .input-short {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<form th:action="@{/crearTorneo}" method="post" class="form-card">

    <div class="form-header">
        FORMULARIO TORNEO
    </div>

    <div class="form-body">
        <div class="grid-inputs">

            <!-- Columna Izquierda -->
            <div class="form-group">
                <label for="nombreTorneo">Ingresar nombre Torneo</label>
                <input type="text" id="nombreTorneo" name="nombreTorneo" class="input-text" placeholder="Ingrese un nombre descriptivo..." required>
            </div>

            <!-- Columna Derecha -->
            <div class="form-group">
                <label for="cantidadEquipos">Ingresar Cantidad de Equipos</label>
                <input type="number" id="cantidadEquipos" name="cantidadEquipos" class="input-text input-short" required>
            </div>

            <!-- Columna Izquierda -->
            <div class="form-group">
                <label for="maxJugadores">Ingresar Cantidad Máxima de jugadores por equipo</label>
                <input type="number" id="maxJugadores" name="maxJugadores" class="input-text input-short" required>
            </div>

            <!-- Columna Derecha -->
            <div class="form-group">
                <label for="minJugadores">Ingresar Cantidad Mínima de jugadores por equipo</label>
                <input type="number" id="minJugadores" name="minJugadores" class="input-text input-short" required>
            </div>

            <!-- Columna Izquierda -->
            <div class="form-group">
                <label for="idaVuelta">Partidos de ida y vuelta</label>
                <input type="checkbox" id="idaVuelta" name="idaVuelta" class="checkbox-custom">
            </div>

            <!-- Columna Derecha -->
            <div class="form-group">
                <label for="amarillasSuspension">Ingresar Cantidad De Amarillas para suspensión</label>
                <input type="number" id="amarillasSuspension" name="amarillasSuspension" class="input-text input-short" required>
            </div>

        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-blanco">Agregar Equipos</button>
            <button type="submit" class="btn btn-verde">Finalizar Creación</button>
        </div>
    </div>

</form>

</body>
</html>
