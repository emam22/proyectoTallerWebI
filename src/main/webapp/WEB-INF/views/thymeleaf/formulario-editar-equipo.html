<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png?v=2}"/>

    <title>Editar Equipo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #1f1f1f;
            color: white;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-card {
            width: 100%;
            max-width: 850px;
            background: #444444;
            border: 2px solid #b6ff00;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .form-header {
            background: #b6ff00;
            color: #111;
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-body {
            padding: 25px;
        }

        .grid-equipo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 40px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
            color: #efefef;
        }

        .input-text {
            background: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            color: #333;
            outline: none;
            width: 210px;
        }

        .color-pickers {
            display: flex;
            gap: 8px;
        }

        .color-box {
            width: 38px;
            height: 28px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .color-box::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-box::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }

        .error-form {
            background: rgba(255, 51, 51, 0.15);
            border: 1px solid #ff3333;
            color: #ff6666;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-verde {
            background: #b6ff00;
            color: #111;
        }

        .btn-blanco {
            background: white;
            color: #333;
            border: 1px solid #ccc;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-blanco:hover {
            background: #f2f2f2;
        }

        /* ESCUDO DEL EQUIPO */
        .escudo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .escudo-preview {
            width: 90px;
            height: 90px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
            padding: 5px;
            border: 1px solid #b6ff00;
        }

        .escudo-input {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .escudo-input input[type="file"] {
            max-width: 220px;
            color: white;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            .grid-equipo {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .form-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .input-text {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="form-card">

    <div class="form-header">
        EDITAR EQUIPO
    </div>

    <div class="form-body">

        <!-- MENSAJE DE ERROR -->
        <div class="error-form"
             th:if="${error}"
             th:text="${error}">
            Error
        </div>

        <!-- FORMULARIO DE EDICIÓN -->
        <form th:action="@{/actualizar-equipo}" method="post">

            <input type="hidden"
                   name="idEquipo"
                   th:value="${equipo.id}">

            <input type="hidden"
                   name="idTorneo"
                   th:value="${idTorneo}">

            <div class="grid-equipo">

                <!-- NOMBRE -->
                <div class="form-group">
                    <label for="nombre">Nombre del equipo</label>

                    <input type="text"
                           id="nombre"
                           name="nombre"
                           class="input-text"
                           th:value="${equipo.nombre}"
                           required>
                </div>

                <!-- COLORES LOCAL -->
                <div class="form-group">
                    <label>Colores de local</label>

                    <div class="color-pickers">
                        <input type="color"
                               name="colorLocal1"
                               class="color-box"
                               th:value="${equipo.colorLocal1 != null ? equipo.colorLocal1 : '#ffffff'}">

                        <input type="color"
                               name="colorLocal2"
                               class="color-box"
                               th:value="${equipo.colorLocal2 != null ? equipo.colorLocal2 : '#ff3333'}">
                    </div>
                </div>

                <!-- COLORES VISITANTE -->
                <div class="form-group">
                    <label>Colores de visitante</label>

                    <div class="color-pickers">
                        <input type="color"
                               name="colorVisitante1"
                               class="color-box"
                               th:value="${equipo.colorVisitante1 != null ? equipo.colorVisitante1 : '#33ffff'}">

                        <input type="color"
                               name="colorVisitante2"
                               class="color-box"
                               th:value="${equipo.colorVisitante2 != null ? equipo.colorVisitante2 : '#ff66cc'}">
                    </div>
                </div>



                <!-- SIGLAS -->
                <div class="form-group">
                    <label for="siglas">
                        Ingresar siglas (3 a 5 letras)
                    </label>

                    <input
                            type="text"
                            id="siglas"
                            name="siglas"
                            class="input-text"
                            minlength="3"
                            maxlength="5"
                            pattern="[A-Za-z]{3,5}"
                            title="Las siglas deben tener entre 3 y 5 letras."
                            oninput="this.value = this.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5)"
                            th:value="${equipo.siglas}"

                            required
                    >
                </div>

                <!-- ESCUDO -->
                <div class="form-group">
                    <label for="escudoEquipo">Escudo del equipo</label>

                    <div class="escudo-container">
                        <img id="previewEscudo"
                             class="escudo-preview"
                             th:src="${equipo.escudo != null and !equipo.escudo.isEmpty()}
         ? @{${equipo.escudo}} : ''"
                             th:style="${equipo.escudo == null or equipo.escudo.isEmpty()}
         ? 'display:none' : 'display:block'"
                             alt="Escudo del equipo">

                        <span id="sinEscudo"
                              th:unless="${equipo.escudo != null and !equipo.escudo.isEmpty()}">
    Sin escudo cargado
</span>

                        <div class="escudo-input">
                            <input type="file"
                                   id="escudoEquipo"
                                   accept="image/png,image/jpeg,image/webp">

                            <input type="hidden"
                                   id="escudoRuta"
                                   name="escudoRuta"
                                   th:value="${equipo.escudo}">
                        </div>
                    </div>
                </div>

            </div>

            <!-- GUARDAR CAMBIOS -->
            <div class="form-actions">
                <button type="submit" class="btn btn-verde">
                    Guardar cambios
                </button>
            </div>



            <!-- BOTÓN PARA GESTIONAR JUGADORES -->
            <div class="form-actions">
                <a th:href="@{/jugadoresTorneoEditar(
                    idTorneo=${idTorneo},
                    idEquipo=${equipo.id}
                    )}"
                   class="btn btn-blanco">
                    Gestionar jugadores
                </a>
            </div>

        </form>

        <!-- CANCELAR -->
        <div class="form-actions">
            <a th:href="@{/editar-equipo(idTorneo=${idTorneo})}"
               class="btn btn-blanco">
                Cancelar
            </a>
        </div>

    </div>
</div>

<a th:replace="~{fragments/nav :: logoHome(clase='logo-marca')}"></a>

<div class="menu-usuario">
    <button type="button"
            class="btn-menu-hamburguesa"
            id="btnMenuUsuario"
            aria-label="Abrir menú">
        <span></span>
        <span></span>
    </button>

    <div class="menu-usuario-opciones" id="menuUsuarioOpciones">
        <a th:href="@{/logout}">Cerrar sesión</a>
    </div>
</div>

<script th:src="@{/js/menu.js}"></script>

<script>
    const selectorEscudo = document.getElementById("escudoEquipo");
    const campoRuta = document.getElementById("escudoRuta");
    const previewEscudo = document.getElementById("previewEscudo");
    const sinEscudo = document.getElementById("sinEscudo");
    const formulario = document.querySelector('form[action*="actualizar-equipo"]');

    selectorEscudo.addEventListener("change", async function () {
        const archivo = selectorEscudo.files[0];
        if (!archivo) return;

        if (!["image/png", "image/jpeg", "image/webp"].includes(archivo.type)) {
            alert("Seleccioná una imagen PNG, JPG o WEBP.");
            selectorEscudo.value = "";
            return;
        }

        try {
            const respuesta = await fetch(
                "/spring/subirEscudo?nombre=" + encodeURIComponent(archivo.name),
                {
                    method: "POST",
                    headers: { "Content-Type": "application/octet-stream" },
                    body: archivo
                }
            );

            if (!respuesta.ok) {
                throw new Error(await respuesta.text());
            }

            const ruta = (await respuesta.text()).trim();
            campoRuta.value = ruta;

            previewEscudo.onload = function () {
                previewEscudo.style.display = "block";
                sinEscudo.style.display = "none";
            };

            previewEscudo.onerror = function () {
                alert("El escudo se guardó, pero no se pudo mostrar. Revisá la ruta de imágenes.");
            };

            previewEscudo.src = ruta.startsWith("/spring/")
                ? ruta
                : "/spring" + (ruta.startsWith("/") ? ruta : "/" + ruta);

        } catch (error) {
            alert(error.message || "No se pudo cargar el escudo.");
        }
    });

    formulario.addEventListener("submit", function (evento) {
        if (selectorEscudo.files.length > 0 && !campoRuta.value) {
            evento.preventDefault();
            alert("Esperá a que termine de cargarse el escudo.");
        }
    });
</script>

</body>
</html>
