<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png?v=2}"/>
    <title>Editar equipo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #1f1f1f;
            color: white;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-card {
            width: 100%;
            max-width: 850px;
            background: #444444;
            border: 2px solid #b6ff00;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .form-header {
            background: #b6ff00;
            color: #111;
            padding: 15px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .form-body {
            padding: 25px;
        }

        .grid-equipo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px 40px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
            color: #efefef;
        }

        .input-text {
            width: 100%;
            background: white;
            border: none;
            border-radius: 8px;
            padding: 11px 12px;
            font-size: 14px;
            color: #333;
            outline: none;
        }

        .input-text:focus {
            box-shadow: 0 0 0 2px #b6ff00;
        }

        .input-file {
            width: 100%;
            background: #333;
            color: white;
            padding: 9px;
            border-radius: 8px;
            font-size: 13px;
        }

        .color-pickers {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .color-box {
            width: 48px;
            height: 36px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .color-box::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-box::-webkit-color-swatch {
            border: 2px solid white;
            border-radius: 6px;
        }

        .escudo-actual {
            font-size: 12px;
            color: #cccccc;
            overflow-wrap: anywhere;
        }

        .error-form {
            background: rgba(255, 51, 51, 0.15);
            border: 1px solid #ff3333;
            color: #ff6666;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 18px;
        }

        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-verde {
            background: #b6ff00;
            color: #111;
        }

        .btn-blanco {
            background: white;
            color: #333;
            border: 1px solid #ccc;
        }

        @media (max-width: 700px) {
            .grid-equipo {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .form-body {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="form-card">

    <div class="form-header">
        Editar equipo
    </div>

    <div class="form-body">

        <div class="error-form"
             th:if="${error}"
             th:text="${error}">
            Error
        </div>

        <form th:action="@{/actualizar-equipo}"
              method="post"
              enctype="multipart/form-data">

            <!-- Identificadores -->
            <input type="hidden"
                   name="idEquipo"
                   th:value="${equipo.id}">

            <input type="hidden"
                   name="idTorneo"
                   th:value="${idTorneo}">

            <div class="grid-equipo">

                <!-- Nombre -->
                <div class="form-group">
                    <label for="nombreEquipo">
                        Nombre del equipo
                    </label>

                    <input type="text"
                           id="nombreEquipo"
                           name="nombreEquipo"
                           class="input-text"
                           th:value="${equipo.nombre}"
                           required>
                </div>

                <!-- Escudo -->
                <div class="form-group">
                    <label for="escudoEquipo">
                        Cambiar escudo (opcional)
                    </label>

                    <input type="file"
                           id="escudoEquipo"
                           name="escudoEquipo"
                           class="input-file"
                           accept="image/*">

                    <span class="escudo-actual"
                          th:if="${equipo.escudo != null}"
                          th:text="'Escudo actual: ' + ${equipo.escudo}">
                        Escudo actual
                    </span>
                </div>

                <!-- Colores local -->
                <div class="form-group">
                    <label>Colores de camiseta local</label>

                    <div class="color-pickers">
                        <input type="color"
                               id="colorLocal1"
                               name="colorLocal1"
                               class="color-box"
                               value="#ffffff"
                               title="Primer color local">

                        <input type="color"
                               id="colorLocal2"
                               name="colorLocal2"
                               class="color-box"
                               value="#ff3333"
                               title="Segundo color local">
                    </div>
                </div>

                <!-- Colores visitante -->
                <div class="form-group">
                    <label>Colores de camiseta visitante</label>

                    <div class="color-pickers">
                        <input type="color"
                               id="colorVisitante1"
                               name="colorVisitante1"
                               class="color-box"
                               value="#33ffff"
                               title="Primer color visitante">

                        <input type="color"
                               id="colorVisitante2"
                               name="colorVisitante2"
                               class="color-box"
                               value="#ff66cc"
                               title="Segundo color visitante">
                    </div>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-verde">
                    Guardar cambios
                </button>

                <a th:href="@{/editar-equipo(idTorneo=${idTorneo})}"
                   class="btn btn-blanco">
                    Cancelar
                </a>
            </div>

        </form>

    </div>
</div>

<img class="logo-marca"
     th:src="@{/img/isotipo.png?v=2}"
     alt="System TOR"/>

<div class="menu-usuario">
    <button type="button"
            class="btn-menu-hamburguesa"
            id="btnMenuUsuario"
            aria-label="Abrir menú">
        <span></span>
        <span></span>
    </button>

    <div class="menu-usuario-opciones" id="menuUsuarioOpciones">
        <a th:href="@{/logout}">Cerrar sesión</a>
    </div>
</div>

<script th:src="@{/js/menu.js}"></script>

</body>
</html>
