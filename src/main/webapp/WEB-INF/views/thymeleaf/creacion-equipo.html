<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png?v=2}"/>
    <title>Creación Equipo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #1f1f1f;
            color: white;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTENEDOR PRINCIPAL */
        .form-card {
            width: 100%;
            max-width: 850px;
            background: #444444;
            border: 2px solid #b6ff00;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* ENCABEZADO */
        .form-header {
            background: #b6ff00;
            color: #111;
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* CUERPO */
        .form-body {
            padding: 25px;
        }

        /* GRID */
        .grid-equipo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 40px;
            margin-bottom: 25px;
        }

        /* GRUPOS */
        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
            color: #efefef;
        }

        /* INPUTS */
        .input-text {
            background: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            color: #333;
            outline: none;
            width: 210px;
        }

        /* ESCUDO */
        .input-file-escudo {
            width: 60px;
            height: 50px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .input-file-escudo input[type="file"] {
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* COLORES */
        .color-pickers {
            display: flex;
            gap: 8px;
        }

        .color-box {
            width: 38px;
            height: 28px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .color-box::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-box::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }

        /* MENSAJE DE ERROR */
        .error-form {
            background: rgba(255, 51, 51, 0.15);
            border: 1px solid #ff3333;
            color: #ff6666;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        /* CONTADOR */
        .contador-equipos {
            background: #333333;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }

        .contador-equipos p {
            font-size: 14px;
            font-weight: bold;
        }

        /* BOTONES */
        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-verde {
            background: #b6ff00;
            color: #111;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* ESPACIO ENTRE FORMULARIOS */
        .form-finalizar {
            margin-top: 12px;
        }

        a.btn {
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-blanco {
            background-color: white;
            color: #333;
            border: 1px solid #ccc;
        }

        .btn-blanco:hover {
            background-color: #f2f2f2;
        }

        .btn-deshabilitado {
            pointer-events: none;
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            .grid-equipo {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .form-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }

            .input-text {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="form-card">

    <!-- ENCABEZADO -->
    <div class="form-header">
        CREACIÓN DE EQUIPO
    </div>

    <!-- CUERPO -->
    <div class="form-body">

        <!-- MENSAJE DE ERROR -->
        <div class="error-form"
             th:if="${error}"
             th:text="${error}">
            Error
        </div>

        <!-- FORMULARIO EQUIPO -->
        <form id="formEquipo"
              th:action="@{/guardarEquipo(idTorneo=${idTorneo})}"
              method="post">

            <div class="grid-equipo">

                <!-- NOMBRE -->
                <div class="form-group">
                    <label for="nombreEquipo">
                        Ingresar nombre de equipo
                    </label>

                    <input type="text"
                           id="nombreEquipo"
                           name="nombreEquipo"
                           class="input-text"
                           required>
                </div>

                <!-- ESCUDO -->
                <div class="form-group">
                    <label for="escudoEquipo">
                        Ingresar escudo de equipo
                    </label>

                    <div class="input-file-escudo">
                        <input type="file"
                               id="escudoEquipo"
                               name="escudoEquipo"
                               accept="image/*">
                    </div>
                </div>

                <!-- COLORES LOCAL -->
                <div class="form-group">
                    <label>
                        Ingresar Colores Local
                    </label>

                    <div class="color-pickers">

                        <input type="color"
                               name="colorLocal1"
                               value="#ffffff"
                               class="color-box">

                        <input type="color"
                               name="colorLocal2"
                               value="#ff3333"
                               class="color-box">

                    </div>
                </div>

                <!-- COLORES VISITANTE -->
                <div class="form-group">
                    <label>
                        Ingresar Colores Visitante
                    </label>

                    <div class="color-pickers">

                        <input type="color"
                               name="colorVisitante1"
                               value="#33ffff"
                               class="color-box">

                        <input type="color"
                               name="colorVisitante2"
                               value="#ff66cc"
                               class="color-box">

                    </div>
                </div>

            </div>

            <!-- CONTADOR -->
            <div class="contador-equipos">
                <p>
                    Equipos:
                    <strong th:text="${cantidadEquiposActuales}">0</strong>
                    /
                    <strong th:text="${cantidadEquiposNecesarios}">4</strong>
                </p>
            </div>

            <!-- AGREGAR EQUIPO -->
            <div class="form-actions">

                <button type="submit"
                        class="btn btn-verde"
                        id="btnAgregarEquipo"
                        th:disabled="${cantidadEquiposActuales >= cantidadEquiposNecesarios}">
                    Agregar Equipo
                </button>

            </div>

        </form>


        <!-- BOTÓN PARA IMPORTAR EQUIPO EXISTENTE -->
        <div class="form-actions">
            <a th:href="@{/lista-equipos(idTorneo=${idTorneo})}"
               class="btn btn-blanco"
               th:classappend="${cantidadEquiposActuales >= cantidadEquiposNecesarios} ? ' btn-deshabilitado' : ''"
               th:attr="aria-disabled=${cantidadEquiposActuales >= cantidadEquiposNecesarios}">
                Cargar equipo existente
            </a>
        </div>
        <!-- FINALIZAR TORNEO -->
        <div class="form-actions form-finalizar">

            <form th:action="@{/finalizarTorneo}"
                  method="post">

                <input type="hidden"
                       name="idTorneo"
                       th:value="${idTorneo}">

                <button type="submit"
                        class="btn btn-verde"
                        th:disabled="${cantidadEquiposActuales < cantidadEquiposNecesarios}">
                    Finalizar creación del torneo
                </button>

            </form>

        </div>

    </div>
</div>

<!-- LOGO -->
<img class="logo-marca"
     th:src="@{/img/isotipo.png?v=2}"
     alt="System TOR"/>

<!-- MENÚ -->
<div class="menu-usuario">

    <button type="button"
            class="btn-menu-hamburguesa"
            id="btnMenuUsuario"
            aria-label="Abrir menú">

        <span></span>
        <span></span>

    </button>

    <div class="menu-usuario-opciones"
         id="menuUsuarioOpciones">

        <a th:href="@{/logout}">
            Cerrar sesión
        </a>

    </div>

</div>

<script th:src="@{/js/menu.js}"></script>

</body>
</html>
