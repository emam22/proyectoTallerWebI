<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Creación Equipo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #1f1f1f;
            color: white;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTENEDOR PRINCIPAL */
        .card-container {
            width: 100%;
            max-width: 850px;
            background: #444444;
            border: 2px solid #b6ff00;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* HEADER */
        .card-header {
            background: #b6ff00;
            color: #111;
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* CUERPO */
        .card-body {
            padding: 20px 25px;
        }

        .grid-equipo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 30px;
            margin-bottom: 20px;
            align-items: center;
        }

        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
        }

        .input-text {
            background: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            color: #333;
            outline: none;
            width: 200px;
        }

        /* SELECTORES DE COLOR / ESCUDO */
        .color-pickers {
            display: flex;
            gap: 8px;
        }

        .color-box {
            width: 38px;
            height: 28px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .color-box::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .color-box::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }

        .input-file-escudo {
            width: 60px;
            height: 50px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .input-file-escudo input[type="file"] {
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* SECCIÓN JUGADORES */
        .jugadores-bar {
            background: #b6ff00;
            color: #111;
            padding: 8px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .tabla-jugadores {
            width: 100%;
            border-collapse: collapse;
            background: #333333;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .tabla-jugadores th {
            color: white;
            padding: 10px;
            font-size: 12px;
            text-align: center;
        }

        .tabla-jugadores td {
            padding: 10px;
            font-size: 12px;
            text-align: center;
            border-top: 1px solid #444;
        }

        .btn-eliminar {
            background: #ff3333;
            color: white;
            border: none;
            border-radius: 4px;
            width: 22px;
            height: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
        }

        /* BOTONES ACCIÓN */
        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-verde-oscuro {
            background: #b6ff00;
            color: #111;
        }

        .btn-verde-claro {
            background: #50ff50;
            color: #111;
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            .grid-equipo {
                grid-template-columns: 1fr;
            }
            .form-group {
                flex-direction: column;
                align-items: flex-start;
            }
            .input-text {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="card-container">

    <div class="card-header">
        CREACIÓN EQUIPO
    </div>

    <div class="card-body">

        <form th:action="@{/guardarEquipo}" method="post">
            <div class="grid-equipo">

                <div class="form-group">
                    <label for="nombreEquipo">Ingresar nombre de equipo</label>
                    <input type="text" id="nombreEquipo" name="nombreEquipo" class="input-text" required>
                </div>

                <div class="form-group">
                    <label for="escudoEquipo">Ingresar escudo de equipo</label>
                    <div class="input-file-escudo">
                        <input type="file" id="escudoEquipo" name="escudoEquipo" accept="image/*">
                    </div>
                </div>

                <div class="form-group">
                    <label>Ingresar Colores Titular</label>
                    <div class="color-pickers">
                        <input type="color" name="colorTitular1" value="#ffffff" class="color-box">
                        <input type="color" name="colorTitular2" value="#ff3333" class="color-box">
                    </div>
                </div>

                <div class="form-group">
                    <label>Ingresar Colores Suplente</label>
                    <div class="color-pickers">
                        <input type="color" name="colorSuplente1" value="#33ffff" class="color-box">
                        <input type="color" name="colorSuplente2" value="#ff66cc" class="color-box">
                    </div>
                </div>

            </div>
        </form>

        <!-- SECCIÓN JUGADORES -->
        <div class="jugadores-bar">
            <span>INGRESAR JUGADORES</span>
            <span>Mín. 11  Máx. 23</span>
        </div>

        <table class="tabla-jugadores">
            <thead>
            <tr>
                <th>Nro. Dorsal</th>
                <th>Puesto</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Categoría (edad)</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>9</td>
                <td>Delantero</td>
                <td>Juan</td>
                <td>Perez</td>
                <td>18</td>
                <td>
                    <button type="button" class="btn-eliminar">&times;</button>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- BOTONES DE ACCIÓN -->
        <div class="form-actions">
            <button type="button" class="btn btn-verde-oscuro">Agregar Equipo</button>
            <button type="button" class="btn btn-verde-claro">Importar equipos</button>
