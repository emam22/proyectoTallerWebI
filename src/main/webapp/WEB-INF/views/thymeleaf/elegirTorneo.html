<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador - Selección de Torneo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #262626;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1{
            color: #55f348;
            text-align: center;
            padding-left: 1.2rem;
        }

        /* HEADER / NAVBAR MULTICOLOR */
        .navbar {
            width: 100%;
            height: 64px;
            background-color: #b6ff00; /* Franja verde lima derecha */
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        .navbar-brand-wrapper {
            display: flex;
            height: 100%;
            align-items: stretch;
        }

        /* Bloque blanco con el logo */
        .navbar-logo-box {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
            z-index: 2;
            width: 110px;
        }

        .navbar-logo-box img {
            height: 38px;
            width: auto;
            object-fit: contain;
        }

        /* Bloque verde intermedio (SIMULADOR) con sesgo invertido */
        .navbar-title-box {
            background-color: #55f348;
            display: flex;
            align-items: center;
            padding-left: 20px;
            padding-right: 45px;
            margin-left: -20px;
            clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%);
            z-index: 1;
        }

        .navbar-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Mensaje de usuario a la derecha */
        .navbar-user {
            color: #000000;
            font-weight: bold;
            font-size: 16px;
            padding-right: 30px;
        }

        /* CONTENEDOR CENTRAL DE TORNEOS */
        .contenedor {
            width: 100%;
            max-width: 650px;
            margin: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* BOTONES DE TORNEO */
        .torneo-link {
            text-decoration: none;
            display: block;
        }

        .torneo-card {
            background-color: #484848;
            border: 2px solid #b6ff00;
            border-radius: 14px;
            padding: 34px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .torneo-card:hover {
            background-color: #525252;
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(182, 255, 0, 0.2);
        }

        .torneo-card h2 {
            color: #b6ff00;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Mensaje en caso de que no haya torneos cargados */
        .sin-torneos {
            text-align: center;
            color: #a0a0a0;
            font-size: 16px;
            padding: 40px 0;
        }

        /* RESPONSIVE */
        @media (max-width: 650px) {
            .navbar {
                height: 52px;
            }
            .navbar-logo-box {
                width: 85px;
                padding: 0 10px;
            }
            .navbar-logo-box img {
                height: 28px;
            }
            .navbar-title {
                font-size: 15px;
            }
            .navbar-user {
                font-size: 13px;
                padding-right: 15px;
            }
            .torneo-card {
                padding: 24px 15px;
            }
            .torneo-card h2 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<!-- NAVBAR SUPERIOR -->
<header class="navbar">
    <div class="navbar-brand-wrapper">
        <!-- Contenedor blanco con el logo del jugador -->
        <div class="navbar-logo-box">
            <img th:src="@{/img/isotipo.png?v=2}" src="https://via.placeholder.com/40" alt="Logo">
        </div>
        <!-- Bloque verde sesgado -->
        <div class="navbar-title-box">
            <span class="navbar-title">SIMULADOR</span>
        </div>
    </div>

    <div class="navbar-user">
        <span th:text="${usuario != null ? 'Bienvenido ' + usuario.nombre : 'Bienvenido'}">Bienvenido Administrador</span>
    </div>
</header>

<!-- LISTADO DINÁMICO DE TORNEOS -->
<main class="contenedor">
    <h1> ELIGE UN TORNEO </h1>
    <!-- Itera la lista enviada desde el controlador -->
    <a th:each="torneo : ${torneos}"
       th:href="@{/lobby(idTorneo=${torneo.id})}"
       class="torneo-link">
        <div class="torneo-card">
            <h2 th:text="${torneo.nombre}">Torneo 1</h2>
        </div>
    </a>

    <!-- Si la lista está vacía -->
    <div th:if="${#lists.isEmpty(torneos)}" class="sin-torneos">
        <p>No hay torneos disponibles en este momento.</p>
    </div>
</main>

</body>
</html>
