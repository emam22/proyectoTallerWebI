<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resumen de la fecha</title>

    <link rel="stylesheet" th:href="@{/css/app.css?v=4}"/>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png?v=2}"/>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #1f1f1f;
            color: white;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 35px;
        }

        .encabezado h1 {
            color: #b6ff00;
            font-size: 30px;
            margin-bottom: 12px;
        }

        .encabezado p {
            color: #ccc;
            font-size: 16px;
        }

        .info-jornada {
            border: 2px solid #b6ff00;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 25px;
            background: #232323;
        }

        .info-jornada h2 {
            color: #b6ff00;
            font-size: 21px;
        }

        .partidos-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .partido-card {
            background: #303030;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 20px;
            transition: border-color 0.2s ease;
        }

        .partido-card:hover {
            border-color: #b6ff00;
        }

        .partido-etiqueta {
            color: #b6ff00;
            font-size: 12px;
            text-align: center;
            margin-bottom: 18px;
            font-weight: bold;
        }

        .resultado {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 15px;
            text-align: center;
        }

        .equipo {
            font-size: 17px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .equipo-local {
            text-align: right;
        }

        .equipo-visitante {
            text-align: left;
        }

        .marcador {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1f1f1f;
            border: 1px solid #b6ff00;
            border-radius: 8px;
            padding: 10px 16px;
        }

        .goles {
            color: #b6ff00;
            font-size: 27px;
            font-weight: bold;
            min-width: 20px;
        }

        .separador {
            color: #aaa;
            font-size: 20px;
        }

        /* EVENTOS DEL PARTIDO */
        .eventos-partido {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #555;
        }

        .eventos-partido h3 {
            color: #b6ff00;
            font-size: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .lista-eventos {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 600px;
            margin: auto;
        }

        .evento {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
            background: #232323;
            border-radius: 6px;
            padding: 11px 14px;
            font-size: 14px;
        }

        .evento-minuto {
            color: #aaa;
            font-weight: bold;
            min-width: 35px;
        }

        .evento-gol strong {
            color: #b6ff00;
        }

        .evento-amarilla strong {
            color: #ffd43b;
        }

        .evento-roja strong {
            color: #ff5555;
        }

        .evento-asistencia {
            color: #aaa;
            font-size: 12px;
        }

        .sin-eventos {
            color: #aaa;
            text-align: center;
            font-size: 13px;
            padding: 10px;
        }

        .mensaje-vacio {
            background: #303030;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            color: #ccc;
        }

        .mensaje-error {
            color: #ff7777;
            background: #3a2222;
            border: 1px solid #ff7777;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .volver-container {
            display: flex;
            justify-content: center;
            margin-top: 35px;
        }

        .btn-volver {
            display: inline-block;
            text-decoration: none;
            color: #1f1f1f;
            background: #b6ff00;
            font-weight: bold;
            padding: 13px 25px;
            border-radius: 7px;
            transition: background 0.2s ease;
        }

        .btn-volver:hover {
            background: #d0ff66;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .encabezado h1 {
                font-size: 24px;
            }

            .resultado {
                gap: 6px;
            }

            .equipo {
                font-size: 12px;
            }

            .marcador {
                gap: 7px;
                padding: 8px;
            }

            .goles {
                font-size: 22px;
            }

            .evento {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR GLOBAL -->
<div th:replace="~{fragments/nav :: barraNavegacion}"></div>

<div class="contenedor">

    <header class="encabezado">
        <h1>RESUMEN DE LA FECHA</h1>
        <p>Resultados de los partidos disputados</p>
    </header>

    <div class="mensaje-error"
         th:if="${error != null}"
         th:text="${error}">
    </div>

    <section class="info-jornada" th:if="${jornada != null}">
        <h2 th:text="'JORNADA ' + ${jornada.numero}">
            JORNADA 1
        </h2>
    </section>

    <!-- LISTADO DE PARTIDOS -->
    <section class="partidos-container"
             th:if="${resumenPartidos != null and !resumenPartidos.isEmpty()}">

        <article class="partido-card"
                 th:each="resumen, iteracion : ${resumenPartidos}">

            <div class="partido-etiqueta"
                 th:text="'PARTIDO ' + ${iteracion.count}">
                PARTIDO 1
            </div>

            <!-- RESULTADO DEL PARTIDO -->
            <div class="resultado">

                <div class="equipo equipo-local"
                     th:text="${resumen.partido.equipoLocal.nombre}">
                    Equipo local
                </div>

                <div class="marcador">
                    <span class="goles"
                          th:text="${resumen.partido.golesLocal}">
                        2
                    </span>

                    <span class="separador">-</span>

                    <span class="goles"
                          th:text="${resumen.partido.golesVisitante}">
                        1
                    </span>
                </div>

                <div class="equipo equipo-visitante"
                     th:text="${resumen.partido.equipoVisitante.nombre}">
                    Equipo visitante
                </div>

            </div>

            <!-- EVENTOS DEL PARTIDO -->
            <div class="eventos-partido">

                <h3>EVENTOS DEL PARTIDO</h3>

                <div class="lista-eventos"
                     th:if="${resumen.eventos != null and !resumen.eventos.isEmpty()}">

                    <div th:each="evento : ${resumen.eventos}"
                         class="evento"
                         th:classappend="${
                            evento.tipo.name() == 'GOL' ? ' evento-gol' :
                            (evento.tipo.name() == 'AMARILLA' ? ' evento-amarilla' : ' evento-roja')
                         }">

                        <span class="evento-minuto"
                              th:text="${evento.minuto} + '\''">
                            25'
                        </span>

                        <strong th:text="${
                            evento.tipo.name() == 'GOL' ? ' GOL - ' :
                            (evento.tipo.name() == 'AMARILLA' ? ' AMARILLA - ' : ' ROJA - ')
                        }">
                            GOL -
                        </strong>

                        <span th:text="${evento.nombreJugador}">
                            Nombre del jugador
                        </span>

                        <span class="evento-asistencia"
                              th:if="${evento.tipo.name() == 'GOL' and evento.nombreAsistidor != null}"
                              th:text="'(Asistencia: ' + ${evento.nombreAsistidor} + ')'">
                            (Asistencia: Nombre)
                        </span>

                        <span th:if="${evento.nombreEquipo != null}"
                              th:text="' - ' + ${evento.nombreEquipo}">
</span>

                    </div>

                </div>

                <p class="sin-eventos"
                   th:if="${resumen.eventos == null or resumen.eventos.isEmpty()}">
                    No se registraron eventos en este partido.
                </p>

            </div>

        </article>

    </section>

    <div class="mensaje-vacio"
         th:if="${resumenPartidos == null or resumenPartidos.isEmpty()}">
        No hay resultados disponibles para esta jornada.
    </div>

    <div class="volver-container">
        <a th:href="@{/lobby(idTorneo=${idTorneoActual})}"
           class="btn-volver">
            VOLVER AL LOBBY
        </a>
    </div>

</div>
</body>
</html>
