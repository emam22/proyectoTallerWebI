<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Botón "volver" reutilizable.
  Uso:  <a th:replace="~{fragments/nav :: botonVolver(destino='/ruta')}"></a>
  Sin destino: <a th:replace="~{fragments/nav :: botonVolver(destino='')}"></a>
  (usa history.back()).
-->
<th:block th:fragment="botonVolver(destino)">
    <a th:if="${destino != null and destino != ''}"
       class="btn-volver"
       style="width: auto; height: auto;"
       th:href="@{${destino}}"
       title="Volver a la pantalla anterior">&#8592; Volver</a>
    <a th:unless="${destino != null and destino != ''}"
       class="btn-volver"
       style="width: auto; height: auto;"
       href="javascript:void(0)"
       onclick="history.back(); return false;"
       title="Volver a la pantalla anterior">&#8592; Volver</a>
</th:block>

<!--
  Isotipo de la app que funciona como link a la home segun el rol de la sesion
  (admin -> /elegirTorneoAdmin, usuario -> /elegirTorneo).
  Uso:  <a th:replace="~{fragments/nav :: logoHome(clase='logo-marca')}"></a>
  Sin clase propia: <a th:replace="~{fragments/nav :: logoHome(clase='')}"></a>
-->
<th:block th:fragment="logoHome(clase)">
    <a th:with="home=${session.ROL != null and session.ROL.equalsIgnoreCase('admin')} ? '/elegirTorneoAdmin' : '/elegirTorneo'"
       th:href="@{${home}}"
       class="logo-home"
       title="Ir al inicio">
        <img th:src="@{/img/isotipo.png?v=2}" src="https://via.placeholder.com/40" alt="System TOR" th:classappend="${clase}"/>
    </a>
</th:block>

<!--
  Barra de navegación global.
  Uso: <div th:replace="~{fragments/nav :: barraNavegacion}"></div>
  Muestra el logo (link a la home según el rol) y, si hay sesión,
  el nombre del rol y el menú de usuario con "Cerrar sesión".
-->
<th:block th:fragment="barraNavegacion">
    <header class="barra-nav"
            th:with="esAdmin=${session.ROL != null and session.ROL.equalsIgnoreCase('admin')},
                     home=${session.ROL == null ? '/login' : (session.ROL.equalsIgnoreCase('admin') ? '/elegirTorneoAdmin' : '/elegirTorneo')}">
        <a class="barra-nav-marca" th:href="@{${home}}" title="Ir al inicio">
            <img th:src="@{/img/isotipo.png?v=2}"
                 alt="System TOR"
                 width="32"
                 height="32"
                 style="width: auto; height: 32px; max-height: 32px; max-width: 32px; object-fit: contain;"/>
            <span class="barra-nav-brand">SystemTOR</span>
        </a>

        <div class="barra-nav-derecha" th:if="${session.ROL != null}">
            <span class="barra-nav-usuario">
                Bienvenido <span class="barra-nav-rol" th:text="${esAdmin} ? 'Administrador' : 'Usuario'">Usuario</span>
            </span>

            <div class="menu-usuario">
                <button type="button" class="btn-menu-hamburguesa" id="btnMenuUsuario" aria-label="Abrir men&uacute;">
                    <span></span>
                    <span></span>
                </button>
                <div class="menu-usuario-opciones" id="menuUsuarioOpciones">
                    <a th:href="@{/logout}">Cerrar sesi&oacute;n</a>
                </div>
            </div>
        </div>
    </header>
    <script th:src="@{/js/menu.js}"></script>
</th:block>

</body>
</html>
