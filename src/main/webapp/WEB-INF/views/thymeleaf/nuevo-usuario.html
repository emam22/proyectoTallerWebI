<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <link rel="stylesheet" th:href="@{/css/app.css?v=4}"/>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>System TOR</title>

  <!-- Boostrap core css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="icon" type="image/png" th:href="@{/img/favicon.png?v=2}" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #1f1f1f;
      color: #ffffff;
      min-height: 100vh;
      padding: 80px 20px 20px;
    }

    .container-form {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .form-signin-heading {
      margin: 0;
      text-align: center;
    }

    .login-titulo {
      color: #b6ff00;
      font-size: 26px;
      font-weight: bold;
    }

    #loginbox {
      margin-top: 20px;
      padding: 28px;
      background: #2c2c2c;
      border: 1px solid #555;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .login-label {
      color: #cccccc;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .login-campo {
      display: flex;
      flex-direction: column;
    }

    .colorgraph {
      border: 0;
      border-top: 1px solid #b6ff00;
      opacity: 0.6;
      margin: 0;
    }

    .form-control {
      background: #2c2c2c;
      border: 1px solid #555;
      border-radius: 8px;
      color: #ffffff;
      padding: 12px 14px;
    }

    .form-control:focus {
      background: #2c2c2c;
      border-color: #b6ff00;
      box-shadow: 0 0 0 3px rgba(182, 255, 0, 0.15);
      color: #ffffff;
      outline: none;
    }

    .form-control::placeholder {
      color: #999999;
    }

    #btn-registrarme {
      width: 100%;
      padding: 12px;
      background-color: #b6ff00;
      border: solid 1px #ffffff;
      border-radius: 8px;
      color: #000000;
      font-size: 16px;
      font-weight: bold;
      transition: background-color 0.25s ease;
    }

    #btn-registrarme:hover {
      background-color: #d9ff66;
      color: #000000;
    }

    #btn-comprar-admin {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid #ffd700;
      border-radius: 8px;
      color: #ffd700;
      font-size: 16px;
      font-weight: bold;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    #btn-comprar-admin:hover {
      background: rgba(255, 215, 0, 0.15);
      color: #ffffff;
    }

    .alert-danger {
      background: rgba(255, 51, 51, 0.15);
      border: 1px solid #ff3333;
      border-radius: 8px;
      color: #ff6666;
      margin: 0;
      padding: 10px 12px;
      text-align: center;
    }

    @media (max-width: 800px) {

      body {
        padding: 70px 10px 10px;
      }

      #loginbox {
        margin-top: 10px;
        padding: 18px;
      }
    }
  </style>

</head>

<body>

<!-- NAVBAR GLOBAL -->
<div th:replace="~{fragments/nav :: barraNavegacion}"></div>

<main role="main" class="container">

    <div class="container">
      <div class="row align-items-center justify-content-center">
        <div id="loginbox" class="mainbox col-md-6 col-sm-10">
          <form class="container-form" action="#" th:action="@{/registrarme}" method="POST" th:object="${usuario}">
            <h3 class="form-signin-heading login-titulo">Nuevo Usuario</h3>
            <hr class="colorgraph">

            <div class="login-campo">
              <label class="login-label" for="email">Email</label>
              <input th:field="*{email}" id="email" class="form-control" placeholder="usuario@unlam.edu.ar" autocomplete="username" required />
            </div>

            <div class="login-campo">
              <label class="login-label" for="password">Contrase&ntilde;a</label>
              <input th:field="*{password}" type="password" id="password" class="form-control" placeholder="Ingres&aacute; tu contrase&ntilde;a" autocomplete="new-password" required />
            </div>

            <button id="btn-registrarme" class="btn btn-lg btn-primary btn-block" Type="Submit">Registrarme</button>
            <button type="button" id="btn-comprar-admin" class="btn btn-lg btn-succes">Comprar cuenta administrador</button>
            <p th:if="${error != null}" class="alert alert-danger" th:text="'Error ' + ${error}">
            </p>
          </form>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>

  <script th:src="@{/js/registro.js}"></script>

</body>

</html>
