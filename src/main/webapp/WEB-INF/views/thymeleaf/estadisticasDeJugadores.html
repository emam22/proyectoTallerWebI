<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas de Jugadores - System TOR</title>
    <link rel="stylesheet" th:href="@{/css/app.css?v=4}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        /* FONDO PATRÓN Y DEGRADADO */
        body {
            margin: 0;
            padding: 20px 40px;
            box-sizing: border-box;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121312;
            background-image:
                    radial-gradient(circle at 85% 20%, rgba(182, 255, 0, 0.12) 0%, transparent 45%),
                    repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 16px),
                    repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 16px);
            background-attachment: fixed;
            color: #fff;
        }

        /* HEADER SUPERIOR */
        .header-superior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            position: relative;
            margin: 0 18px 30px 18px;
            padding-bottom: 25px;
            border-bottom: 2px solid #b6ff00;
            min-height: 60px;
        }

        .isotipo-header {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .titulo-pagina {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #b6ff00;
            text-align: center;
            white-space: nowrap;
        }

        .boton-volver {
            display: inline-block;
            padding: 12px 20px;
            background: #b6ff00;
            color: #232323;
            text-decoration: none;
            font-weight: 900;
            border-radius: 10px;
            transition: 0.2s ease;
            white-space: nowrap;
        }

        .boton-volver:hover {
            background: #d0ff66;
            transform: translateY(-2px);
        }

        .contenedor-encabezado {
            max-width: 1100px;
            margin: 0 auto 30px auto;
            padding: 0 5px;
        }

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 2px solid #b6ff00;
        }

        .encabezado h1 {
            color: #b6ff00;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }


        /* BOTÓN MENÚ DERECHA */
        .btn-menu-hamburguesa {
            background: transparent;
            border: 2px solid #b6ff00;
            border-radius: 8px;
            width: 42px;
            height: 38px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .btn-menu-hamburguesa span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: #b6ff00;
            border-radius: 2px;
        }

        /* CONTENEDOR PRINCIPAL TABLA */
        .contenedor-tabla {
            width: 100%;
            margin-top: 10px;
        }

        /* BOTÓN VOLVER PEGADO ARRIBA */
        .btn-volver-tab {
            display: inline-block;
            background-color: #b6ff00;
            color: #000;
            font-weight: 900;
            font-size: 13px;
            text-decoration: none;
            padding: 8px 24px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            margin-bottom: 0;
            transition: opacity 0.2s;
        }

        .btn-volver-tab:hover {
            opacity: 0.9;
        }

        /* CAJA DE LA TABLA */
        .panel-tabla {
            background-color: #3e3e3e;
            border: 2px solid #b6ff00;
            border-radius: 0 12px 12px 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            scroll-margin-top: 90px;
        }

        .tabla-datos {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
        }

        .tabla-datos thead {
            background-color: #b6ff00;
            color: #000000;
        }

        .tabla-datos th {
            padding: 10px 12px;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tabla-datos th.th-jugador,
        .tabla-datos td.td-jugador {
            text-align: left;
            padding-left: 20px;
        }

        .tabla-datos td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tabla-datos tr:last-child td {
            border-bottom: none;
        }

        .sin-datos {
            padding: 30px;
            color: #aaa;
            font-weight: normal;
        }

        /* VER MÁS: solo se muestran las primeras 15 filas */
        .tabla-datos tr.fila-extra {
            display: none;
        }

        .tabla-datos.tabla-expandida tr.fila-extra {
            display: table-row;
        }

        .pie-tabla {
            display: flex;
            justify-content: center;
            padding: 18px 12px;
            background: rgba(0, 0, 0, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-ver-mas {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 26px;
            border: none;
            border-radius: 999px;
            background: #b6ff00;
            color: #1a1a1a;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .btn-ver-mas:hover {
            background: #d0ff66;
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.45);
        }

        .btn-ver-mas:active {
            transform: translateY(0);
        }

        .btn-ver-mas .contador-ver-mas {
            font-size: 11px;
            font-weight: 700;
            color: rgba(0, 0, 0, 0.65);
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/equipos-modern.css?v=1}"/>
</head>
<body>

<!-- NAVBAR GLOBAL -->
<div th:replace="~{fragments/nav :: barraNavegacion}"></div>


<!--
 BARRA SUPERIOR

<header class="header-superior">
<h1 class="titulo-pagina">ESTADÍSTICAS DE JUGADORES</h1>

    
</header> -->

<div class="contenedor-encabezado">
    <header class="encabezado">
        <h1>ESTADÍSTICAS DE JUGADORES</h1>

        <a th:href="@{/lobby(idTorneo=${idTorneoActual})}"
           class="boton-volver">
            Volver al lobby
        </a>
    </header>
</div>

<!-- TABLA CON PESTAÑA VOLVER -->
<main class="contenedor-tabla">


    <div class="panel-tabla">
        <table class="tabla-datos tabla-moderna" id="tabla-estadisticas">
            <thead>
            <tr>
                <th style="width: 50px;">#</th>
                <th class="th-escudo">Esc.</th>
                <th class="th-jugador">Nombre</th>
                <th class="th-jugador">Apellido</th>
                <th>PJ</th>
                <th>Goles</th>
                <th>Asist.</th>
                <th>Part.</th>
                <th>TA</th>
                <th>TR</th>
            </tr>
            </thead>
            <tbody>
            <!-- Si no hay registros -->
            <tr th:if="${#lists.isEmpty(estadisticasDeJugadores)}">
                <td colspan="10" class="sin-datos">No hay estadísticas cargadas actualmente.</td>
            </tr>

            <!-- Iteración dinámica: las primeras 15 filas quedan visibles -->
            <tr th:each="stat, iter : ${estadisticasDeJugadores}"
                th:classappend="${iter.count > 15} ? 'fila-extra' : ''">
                <td th:text="${iter.count}">1</td>
                <td class="td-escudo">
                    <span class="escudo-chip escudo-chip--sm"
                          th:if="${equiposPorJugador != null and stat.jugador != null and equiposPorJugador.get(stat.jugador.id) != null}">
                        <img th:src="@{${equiposPorJugador.get(stat.jugador.id).escudo}}"
                             th:alt="${equiposPorJugador.get(stat.jugador.id).nombre}"
                             loading="lazy"/>
                    </span>
                </td>
                <td class="td-jugador" th:text="${stat.jugador?.nombre}">Juan</td>
                <td class="td-jugador" th:text="${stat.jugador?.apellido}">Perez</td>
                <td th:text="${stat.partidosJugados} ?: 0">0</td>
                <td th:text="${stat.goles} ?: 0">0</td>
                <td th:text="${stat.asistencias} ?: 0">0</td>
                <td th:text="${stat.participacionesGol} ?: 0">0</td>
                <td th:text="${stat.amarillas} ?: 0">0</td>
                <td th:text="${stat.rojas} ?: 0">0</td>
            </tr>
            </tbody>
        </table>

        <div class="pie-tabla"
             th:if="${estadisticasDeJugadores != null and estadisticasDeJugadores.size() > 15}">

            <button type="button"
                    id="btn-ver-mas"
                    class="btn-ver-mas"
                    aria-controls="tabla-estadisticas"
                    aria-expanded="false"
                    th:attr="data-restantes=${estadisticasDeJugadores.size() - 15}">

                <span class="texto-ver-mas">Ver más</span>

                <span class="contador-ver-mas"
                      th:text="'(' + (${estadisticasDeJugadores.size()} - 15) + ')'">
                    (10)
                </span>

            </button>

        </div>
    </div>
</main>

<script>
    (function () {
        var boton = document.getElementById('btn-ver-mas');
        var tabla = document.getElementById('tabla-estadisticas');

        if (!boton || !tabla) {
            return;
        }

        var texto = boton.querySelector('.texto-ver-mas');
        var contador = boton.querySelector('.contador-ver-mas');
        var restantes = boton.dataset.restantes;

        boton.addEventListener('click', function () {
            var expandida = tabla.classList.toggle('tabla-expandida');

            boton.setAttribute('aria-expanded', expandida ? 'true' : 'false');
            texto.textContent = expandida ? 'Ver menos' : 'Ver más';
            contador.textContent = '(' + restantes + ')';
            contador.style.display = expandida ? 'none' : 'inline';

            if (!expandida) {
                document.querySelector('.panel-tabla').scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        });
    })();
</script>

</body>
</html>
