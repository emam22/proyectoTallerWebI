<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas de Jugadores - System TOR</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        /* FONDO PATRÓN Y DEGRADADO */
        body {
            margin: 0;
            padding: 20px 40px;
            box-sizing: border-box;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121312;
            background-image:
                    radial-gradient(circle at 85% 20%, rgba(182, 255, 0, 0.12) 0%, transparent 45%),
                    repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 16px),
                    repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 16px);
            background-attachment: fixed;
            color: #fff;
        }

        /* HEADER SUPERIOR */
        .header-superior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            position: relative;
            margin: 0 18px 30px 18px;
            padding-bottom: 25px;
            border-bottom: 2px solid #b6ff00;
            min-height: 60px;
        }

        .isotipo-header {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .titulo-pagina {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #b6ff00;
            text-align: center;
            white-space: nowrap;
        }

        .boton-volver {
            display: inline-block;
            padding: 12px 20px;
            background: #b6ff00;
            color: #232323;
            text-decoration: none;
            font-weight: 900;
            border-radius: 10px;
            transition: 0.2s ease;
            white-space: nowrap;
        }

        .boton-volver:hover {
            background: #d0ff66;
            transform: translateY(-2px);
        }

        .contenedor-encabezado {
            max-width: 1100px;
            margin: 0 auto 30px auto;
            padding: 0 5px;
        }

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 2px solid #b6ff00;
        }

        .encabezado h1 {
            color: #b6ff00;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }


        /* BOTÓN MENÚ DERECHA */
        .btn-menu-hamburguesa {
            background: transparent;
            border: 2px solid #b6ff00;
            border-radius: 8px;
            width: 42px;
            height: 38px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .btn-menu-hamburguesa span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: #b6ff00;
            border-radius: 2px;
        }

        /* CONTENEDOR PRINCIPAL TABLA */
        .contenedor-tabla {
            width: 100%;
            margin-top: 10px;
        }

        /* BOTÓN VOLVER PEGADO ARRIBA */
        .btn-volver-tab {
            display: inline-block;
            background-color: #b6ff00;
            color: #000;
            font-weight: 900;
            font-size: 13px;
            text-decoration: none;
            padding: 8px 24px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            margin-bottom: 0;
            transition: opacity 0.2s;
        }

        .btn-volver-tab:hover {
            opacity: 0.9;
        }

        /* CAJA DE LA TABLA */
        .panel-tabla {
            background-color: #3e3e3e;
            border: 2px solid #b6ff00;
            border-radius: 0 12px 12px 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .tabla-datos {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
        }

        .tabla-datos thead {
            background-color: #b6ff00;
            color: #000000;
        }

        .tabla-datos th {
            padding: 10px 12px;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tabla-datos th.th-jugador,
        .tabla-datos td.td-jugador {
            text-align: left;
            padding-left: 20px;
        }

        .tabla-datos td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tabla-datos tr:last-child td {
            border-bottom: none;
        }

        .sin-datos {
            padding: 30px;
            color: #aaa;
            font-weight: normal;
        }f
    </style>
</head>
<body>

<!--
 BARRA SUPERIOR

<header class="header-superior">
    <a th:replace="~{fragments/nav :: logoHome(clase='isotipo-header')}"></a>
    <h1 class="titulo-pagina">ESTADÍSTICAS DE JUGADORES</h1>

    <div class="menu-usuario">
        <button type="button" class="btn-menu-hamburguesa" id="btnMenuUsuario" aria-label="Abrir menú">
            <span></span>
            <span></span>
        </button>
        <div class="menu-usuario-opciones" id="menuUsuarioOpciones">
            <a th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>
</header> -->

<div class="contenedor-encabezado">
    <header class="encabezado">
        <h1>ESTADÍSTICAS DE JUGADORES</h1>

        <a th:href="@{/lobby(idTorneo=${idTorneoActual})}"
           class="boton-volver">
            Volver al lobby
        </a>
    </header>
</div>

<!-- TABLA CON PESTAÑA VOLVER -->
<main class="contenedor-tabla">


    <div class="panel-tabla">
        <table class="tabla-datos">
            <thead>
            <tr>
                <th style="width: 50px;">#</th>
                <th class="th-jugador">Nombre</th>
                <th class="th-jugador">Apellido</th>
                <th>PJ</th>
                <th>Goles</th>
                <th>Asist.</th>
                <th>Part.</th>
                <th>TA</th>
                <th>TR</th>
            </tr>
            </thead>
            <tbody>
            <!-- Si no hay registros -->
            <tr th:if="${#lists.isEmpty(estadisticasDeJugadores)}">
                <td colspan="9" class="sin-datos">No hay estadísticas cargadas actualmente.</td>
            </tr>

            <!-- Iteración dinámica -->
            <tr th:each="stat, iter : ${estadisticasDeJugadores}">
                <td th:text="${iter.count}">1</td>
                <td class="td-jugador" th:text="${stat.jugador?.nombre}">Juan</td>
                <td class="td-jugador" th:text="${stat.jugador?.apellido}">Perez</td>
                <td th:text="${stat.partidosJugados} ?: 0">0</td>
                <td th:text="${stat.goles} ?: 0">0</td>
                <td th:text="${stat.asistencias} ?: 0">0</td>
                <td th:text="${stat.participacionesGol} ?: 0">0</td>
                <td th:text="${stat.amarillas} ?: 0">0</td>
                <td th:text="${stat.rojas} ?: 0">0</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:src="@{/js/menu.js}"></script>

</body>
</html>
