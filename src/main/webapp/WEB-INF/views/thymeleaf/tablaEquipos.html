<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/app.css?v=7}"/>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png?v=2}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tabla de posiciones</title>
</head>
<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #1f1f1f;
        color: white;
        min-height: 100vh;
        padding: 20px;
    }

    /* CONTENEDOR PRINCIPAL */
    .contenedor {
        max-width: 1100px;
        margin: 0 auto 30px auto;
        padding: 0 5px;

    }

    /* =========================
       HEADER
    ========================= */

    .header {
        display: grid;
        grid-template-columns: 1.1fr 2fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }

    .avanzar-fecha {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 10px;
        min-height: 90px;
    }

    .avanzar-fecha h1 {
        color: #b6ff00;
        font-size: 20px;
        margin-bottom: 15px;
    }

    .proxima-fecha {
        font-size: 12px;
        color: #ddd;
    }

    .proxima-fecha span {
        display: block;
        color: white;
        font-size: 14px;
        margin-top: 5px;
    }

    .encabezado {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 35px;
        padding-bottom: 25px;
        border-bottom: 2px solid #b6ff00;
    }

    .encabezado h1 {
        color: #b6ff00;
        font-size: 32px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 0;
    }

    .boton-volver:hover {
        background: var(--accent-hover);
    }


    .panel-tabla {
        border: 2.5px solid #b6ff00;
        border-radius: 14px;
        background: #444444;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100%;
        transition: transform 0.15s ease;
    }

    .panel-tabla:hover {
        transform: translateY(-2px);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: clamp(12px, 1.05vw, 15px);
    }

    thead {
        background: #b6ff00;
        color: #000000;
    }

    th {
        padding: 12px 6px;
        font-size: clamp(11px, 0.95vw, 14px);
        font-weight: 900;
        text-align: center;
    }

    th.th-equipo {
        text-align: left;
        padding-left: 14px;
    }

    td {
        padding: 14px 6px;
        text-align: center;
        color: #ffffff;
        border-bottom: none;
    }

    tbody tr:hover {
        background: rgba(255, 255, 255, 0.05);
    }

    td.posicion {
        font-weight: bold;
        width: 9%;
    }

    td.equipo {
        text-align: left;
        padding-left: 14px;
        font-weight: 500;
        line-height: 1.25;
        width: 32%;
    }

    td.pts {
        font-weight: 900;
    }



    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {

        body {
            padding: 10px;
        }

        .header {
            grid-template-columns: 1fr;
        }

        .contenido {
            grid-template-columns: 1fr;
        }

        .estadisticas {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
    }

    @media (max-width: 500px) {

        .estadisticas {
            grid-template-columns: 1fr;
        }

        table {
            font-size: 9px;
        }

        th {
            font-size: 8px;
        }

        td {
            padding: 6px 2px;
        }
    }

</style>
<link rel="stylesheet" th:href="@{/css/equipos-modern.css?v=5}"/>
</head>

<body>

<!-- NAVBAR GLOBAL -->
<div th:replace="~{fragments/nav :: barraNavegacion}"></div>



<main>


<div class="contenedor">

    <header class="encabezado">
        <h1>TABLA DE POSICIONES</h1>

        <a th:href="@{/lobby(idTorneo=${torneo.id})}"
           class="boton-volver">
            Volver al lobby
        </a>
    </header>

</div>



    <div class="panel-tabla">
      <div class="tabla-scroll">
        <table class="tabla-moderna">
            <thead>
            <tr>
                <th>Pos</th>
                <th class="th-escudo">Escudo</th>
                <th class="th-equipo">Equipo</th>
                <th>PJ</th>
                <th>PG</th>
                <th>PE</th>
                <th>PP</th>
                <th>GF</th>
                <th>GC</th>
                <th>PTS</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iteración dinámica Thymeleaf -->
            <tr th:each="fila, iter : ${tablaPosiciones}">
                <td class="posicion" th:text="${iter.count}">1</td>
                <td class="td-escudo">
                    <span class="escudo-chip escudo-chip--sm">
                        <img th:src="@{${fila.equipo.escudo}}"
                             th:alt="${fila.equipo.nombre}"
                             loading="lazy"/>
                    </span>
                </td>
                <td class="equipo" th:text="${fila.equipo.nombre}">Defensa y Justicia</td>
                <td th:text="${fila.partidosJugados}">10</td>
                <td th:text="${fila.partidosGanados}">5</td>
                <td th:text="${fila.partidosEmpatados}">2</td>
                <td th:text="${fila.partidoPerdidos}">3</td>
                <td th:text="${fila.golesAFavor}">13</td>
                <td th:text="${fila.golesEnContra}">7</td>
                <td class="pts" th:text="${fila.puntos}">17</td>
            </tr>

            </tbody>
        </table>
      </div>
    </div>
</main>
</body>
</html>
