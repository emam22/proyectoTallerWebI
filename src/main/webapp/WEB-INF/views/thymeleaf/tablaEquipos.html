<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png?v=2}"/>
    <title>Title</title>
</head>
<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #1f1f1f;
        color: white;
        min-height: 100vh;
        padding: 20px;
    }

    /* CONTENEDOR PRINCIPAL */
    .contenedor {
        max-width: 1100px;
        margin: auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        display: grid;
        grid-template-columns: 1.1fr 2fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }

    .avanzar-fecha {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 10px;
        min-height: 90px;
    }

    .avanzar-fecha h1 {
        color: #b6ff00;
        font-size: 20px;
        margin-bottom: 15px;
    }

    .proxima-fecha {
        font-size: 12px;
        color: #ddd;
    }

    .proxima-fecha span {
        display: block;
        color: white;
        font-size: 14px;
        margin-top: 5px;
    }


    /* PARTIDO DESTACADO */

    .partido-destacado {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 10px;
        text-align: center;
    }

    .partido {
        margin-bottom: 10px;
    }

    .equipos {
        color: #b6ff00;
        font-weight: bold;
        font-size: 14px;
    }

    .fecha-hora {
        font-size: 10px;
        color: #ddd;
        margin-top: 4px;
    }


    /* INFORMACION DEL TORNEO */

    .info-torneo {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 12px;
        font-size: 12px;
        line-height: 2;
    }

    .info-torneo strong {
        color: white;
    }


    /* =========================
       CONTENIDO
    ========================= */

    .contenido {
        display: grid;
        grid-template-columns: 1fr 1.6fr 1fr;
        gap: 20px;
    }


    /* =========================
       FECHAS
    ========================= */

    .fechas {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        padding: 8px;
    }

    .fecha-card {
        background: #444;
        border-radius: 7px;
        padding: 12px;
        margin-bottom: 10px;
        min-height: 95px;
    }

    .fecha-card:last-child {
        margin-bottom: 0;
    }

    .fecha-card h3 {
        color: #b6ff00;
        text-align: center;
        font-size: 11px;
        margin-bottom: 10px;
    }

    .fecha-card .partido-mini {
        text-align: center;
        font-size: 9px;
        margin-bottom: 8px;
    }

    .fecha-card .equipos-mini {
        color: #b6ff00;
        font-weight: bold;
        font-size: 8px;
    }

    .fecha-card .fecha-mini {
        color: #ccc;
        font-size: 7px;
        margin-top: 3px;
    }


    /* =========================
       TABLA DE POSICIONES
    ========================= */

    .tabla-container {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        overflow: hidden;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
    }

    thead {
        background: #b6ff00;
        color: #222;
    }

    th {
        padding: 7px 4px;
        font-size: 10px;
    }

    td {
        padding: 8px 5px;
        text-align: center;
        border-bottom: 1px solid #555;
    }

    tbody tr {
        background: #444;
    }

    tbody tr:hover {
        background: #505050;
    }

    td.equipo {
        text-align: left;
        font-weight: bold;
    }

    .posicion {
        width: 30px;
    }


    /* =========================
       ESTADISTICAS
    ========================= */

    .estadisticas {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .estadistica-card {
        border: 2px solid #b6ff00;
        border-radius: 7px;
        min-height: 150px;
        overflow: hidden;
    }

    .estadistica-titulo {
        background: #b6ff00;
        color: #222;
        padding: 7px;
        font-size: 11px;
        text-align: center;
    }

    .estadistica-contenido {
        padding: 15px;
        color: #ccc;
        font-size: 11px;
    }

    .estadistica-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .estadistica-item strong {
        color: white;
    }

    .panel-tabla {
        border: 2.5px solid #b6ff00;
        border-radius: 14px;
        background: #444444;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100%;
        transition: transform 0.15s ease;
    }

    .panel-tabla:hover {
        transform: translateY(-2px);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: clamp(12px, 1.05vw, 15px);
    }

    thead {
        background: #b6ff00;
        color: #000000;
    }

    th {
        padding: 12px 6px;
        font-size: clamp(11px, 0.95vw, 14px);
        font-weight: 900;
        text-align: center;
    }

    th.th-equipo {
        text-align: left;
        padding-left: 14px;
    }

    td {
        padding: 14px 6px;
        text-align: center;
        color: #ffffff;
        border-bottom: none;
    }

    tbody tr:hover {
        background: rgba(255, 255, 255, 0.05);
    }

    td.posicion {
        font-weight: bold;
        width: 9%;
    }

    td.equipo {
        text-align: left;
        padding-left: 14px;
        font-weight: 500;
        line-height: 1.25;
        width: 32%;
    }

    td.pts {
        font-weight: 900;
    }



    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {

        body {
            padding: 10px;
        }

        .header {
            grid-template-columns: 1fr;
        }

        .contenido {
            grid-template-columns: 1fr;
        }

        .estadisticas {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
    }

    @media (max-width: 500px) {

        .estadisticas {
            grid-template-columns: 1fr;
        }

        table {
            font-size: 9px;
        }

        th {
            font-size: 8px;
        }

        td {
            padding: 6px 2px;
        }
    }

</style>
</head>

<body>

<div class="contenedor">

    <h1> TABLA DE POSICIONES</h1>

</div>

<main>
    <div class="panel-tabla">
        <table>
            <thead>
            <tr>
                <th>Pos</th>
                <th class="th-equipo">Equipo</th>
                <th>PJ</th>
                <th>PG</th>
                <th>PE</th>
                <th>PP</th>
                <th>GF</th>
                <th>GC</th>
                <th>PTS</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iteración dinámica Thymeleaf -->
            <tr th:each="fila, iter : ${tablaPosiciones}">
                <td class="posicion" th:text="${iter.count}">1</td>
                <td class="equipo" th:text="${fila.equipo.nombre}">Defensa y Justicia</td>
                <td th:text="${fila.partidosJugados}">10</td>
                <td th:text="${fila.partidosGanados}">5</td>
                <td th:text="${fila.partidosEmpatados}">2</td>
                <td th:text="${fila.partidoPerdidos}">3</td>
                <td th:text="${fila.golesAFavor}">13</td>
                <td th:text="${fila.golesEnContra}">7</td>
                <td class="pts" th:text="${fila.puntos}">17</td>
            </tr>

            </tbody>
        </table>
    </div>
</main>
<!-- LOGO DE MARCA -->
<img class="logo-marca" th:src="@{/img/isotipo.png?v=2}" alt="System TOR"/>

<!-- MENÚ DE USUARIO -->
<div class="menu-usuario">
    <button type="button" class="btn-menu-hamburguesa" id="btnMenuUsuario" aria-label="Abrir menú">
        <span></span>
        <span></span>
    </button>
    <div class="menu-usuario-opciones" id="menuUsuarioOpciones">
        <a th:href="@{/logout}">Cerrar sesión</a>
    </div>
</div>
<script th:src="@{/js/menu.js}"></script>

</body>
</html>
