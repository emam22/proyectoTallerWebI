<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png?v=2}"/>
    <title>Jugadores</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-base);
        }

        body {
            background: var(--surface);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .card-container {
            width: 100%;
            max-width: 950px;
            background: var(--surface);
            border: 2px solid var(--accent);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-title {
            color: var(--accent);
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mensaje {
            border-radius: var(--radius-md);
            padding: 10px 12px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
        }

        .mensaje.ok {
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .mensaje.error {
            background: var(--error-bg);
            border: 1px solid var(--error);
            color: var(--error-soft);
        }

        .seccion {
            background: var(--surface-3);
            border-radius: var(--radius-lg);
            padding: 15px;
            margin-bottom: 16px;
        }

        .seccion-titulo {
            background: var(--accent);
            color: var(--bg);
            border-radius: var(--radius-sm);
            padding: 7px 10px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 13px;
        }

        .aviso {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-bottom: 14px;
        }

        thead {
            background: var(--accent);
            color: var(--bg);
        }

        th {
            padding: 7px 6px;
            font-size: 11px;
            text-align: center;
        }

        td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        tbody tr {
            background: var(--surface-2);
        }

        td.campo {
            font-weight: bold;
            text-align: left;
        }

        .form-jugador {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 9px;
        }

        .form-jugador input,
        .form-jugador select {
            background: var(--surface-2);
            border: 1px solid var(--accent);
            border-radius: 6px;
            color: var(--text);
            padding: 8px 9px;
            font-size: 12px;
        }

        .form-jugador input::placeholder {
            color: var(--text-faint);
        }

        .form-jugador button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-jugador button:hover {
            background: var(--accent-hover);
        }

        .btn-eliminar {
            background: var(--error-bg);
            border: 1px solid var(--error);
            color: var(--error-soft);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: background var(--dur-fast), color var(--dur-fast);
        }

        .btn-eliminar:hover {
            background: var(--error);
            color: var(--bg);
        }

        .btn-habilitar {
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: background var(--dur-fast), color var(--dur-fast);
        }

        .btn-habilitar:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .estado-jugador {
            display: inline-block;
            border-radius: 6px;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: bold;
        }

        .estado-jugador.habilitado {
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .estado-jugador.pendiente {
            background: var(--surface-3);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        td form {
            display: inline-block;
            margin-right: 4px;
        }

        .btn-jugadores {
            background: var(--surface-2);
            border: 2px solid var(--accent);
            color: var(--accent);
            border-radius: var(--radius-md);
            padding: 14px 12px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            flex: 1;
            min-width: 200px;
            transition: background var(--dur-fast), color var(--dur-fast);
        }

        .btn-jugadores:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            background: #1f1f1f;
            color: var(--accent);

            border: 2px solid var(--accent);
            border-radius: var(--radius-md);

            padding: 10px 18px;
            margin-bottom: 18px;

            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            cursor: pointer;

            transition: background var(--dur-fast),
            color var(--dur-fast),
            transform var(--dur-fast);
        }

        .btn-volver:hover {
            background: var(--accent);
            color: #000000;
            transform: translateY(-2px);
        }

        .btn-volver:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        @media (max-width: 700px) {
            .header-title {
                font-size: 15px;
                text-align: center;
            }
            .header-bar {
                justify-content: center;
            }
            th, td {
                font-size: 10px;
                padding: 6px 3px;
            }
        }
    </style>
</head>
<body>

<a class="btn-volver"
   th:href="@{/creacion-equipo-admin(idTorneo=${torneo.id})}">
    Volver a lobby
</a>

<div class="card-container">

    <!-- HEADER -->
    <div class="header-bar">
        <div class="header-title">
            JUGADORES: <span th:text="${torneo.nombre}">Torneo</span>
        </div>
    </div>

    <!-- MENSAJES -->
    <div class="mensaje ok" th:if="${ok}" th:text="${ok}">Ok</div>
    <div class="mensaje error" th:if="${error}" th:text="${error}">Error</div>

    <!-- EQUIPOS Y PLANTELES -->
    <div class="aviso" th:if="${#lists.isEmpty(equipos)}">
        Este torneo todavia no tiene equipos inscriptos.
    </div>

    <div class="seccion" th:each="filaEquipo : ${equipos}">
        <div class="seccion-titulo" th:text="${filaEquipo.equipo.nombre}">Equipo</div>

        <table>
            <thead>
            <tr>
                <th>DORSAL</th>
                <th>NOMBRE</th>
                <th>APELLIDO</th>
                <th>PUESTO</th>
                <th>ESTADO</th>
                <th>ACCIONES</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="jugador : ${filaEquipo.jugadores}">
                <td th:text="${jugador.dorsal}">10</td>
                <td class="campo" th:text="${jugador.nombre}">Nombre</td>
                <td th:text="${jugador.apellido}">Apellido</td>
                <td th:text="${jugador.puesto}">Puesto</td>
                <td>
                    <span class="estado-jugador"
                          th:classappend="${jugador.habilitado} ? ' habilitado' : ' pendiente'"
                          th:text="${jugador.habilitado} ? 'Habilitado' : 'Pendiente'">Estado</span>
                </td>
                <td>
                    <form th:action="@{/jugadoresTorneoAdmin/habilitar(idTorneo=${torneo.id})}" method="post">
                        <input type="hidden" name="idEquipo" th:value="${filaEquipo.equipo.id}"/>
                        <input type="hidden" name="idJugador" th:value="${jugador.id}"/>
                        <input type="hidden" name="habilitado" th:value="${jugador.habilitado} ? 'false' : 'true'"/>
                        <button type="submit" class="btn-habilitar"
                                th:text="${jugador.habilitado} ? 'Deshabilitar' : 'Habilitar'">Habilitar</button>
                    </form>
                    <form th:action="@{/jugadoresTorneoAdmin/eliminar(idTorneo=${torneo.id})}" method="post">
                        <input type="hidden" name="idEquipo" th:value="${filaEquipo.equipo.id}"/>
                        <input type="hidden" name="idJugador" th:value="${jugador.id}"/>
                        <button type="submit" class="btn-eliminar">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(filaEquipo.jugadores)}">
                <td colspan="6" class="aviso">Sin jugadores cargados.</td>
            </tr>
            </tbody>
        </table>

        <form class="form-jugador"
              th:action="@{/jugadoresTorneoAdmin/agregar(idTorneo=${torneo.id})}"
              method="post">
            <input type="hidden" name="idEquipo" th:value="${filaEquipo.equipo.id}"/>
            <input type="text" name="nombre" placeholder="Nombre" required/>
            <input type="text" name="apellido" placeholder="Apellido" required/>
            <input type="number" name="dorsal" placeholder="Dorsal" min="1"/>
            <select name="puesto">
                <option value="Arquero">Arquero</option>
                <option value="Defensor">Defensor</option>
                <option value="Mediocampista">Mediocampista</option>
                <option value="Delantero">Delantero</option>
            </select>
            <button type="submit">Agregar jugador</button>
        </form>
    </div>

</div>

<!-- LOGO DE MARCA -->
<img class="logo-marca" th:src="@{/img/isotipo.png?v=2}" alt="System TOR"/>

<!-- MENÚ DE USUARIO -->
<div class="menu-usuario">
    <button type="button" class="btn-menu-hamburguesa" id="btnMenuUsuario" aria-label="Abrir menú">
        <span></span>
        <span></span>
    </button>
    <div class="menu-usuario-opciones" id="menuUsuarioOpciones">
        <a th:href="@{/logout}">Cerrar sesión</a>
    </div>
</div>
<script th:src="@{/js/menu.js}"></script>

</body>
</html>
