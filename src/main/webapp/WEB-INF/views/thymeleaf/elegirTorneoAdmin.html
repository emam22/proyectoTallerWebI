<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" th:href="@{/css/app.css?v=9}"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador - Selección de Torneo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #262626;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1{
            color: var(--accent);
            text-align: center;
        }

        /* CONTENEDOR CENTRAL DE TORNEOS */
        .contenedor {
            width: 100%;
            max-width: 650px;
            margin: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* BOTONES DE TORNEO */
        .torneo-link {
            text-decoration: none;
            display: block;
        }

        .torneo-card {
            background-color: #484848;
            border: 2px solid #b6ff00;
            border-radius: 14px;
            padding: 34px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .torneo-card:hover {
            background-color: #525252;
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(182, 255, 0, 0.2);
        }

        .torneo-card h2 {
            color: #b6ff00;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Mensaje en caso de que no haya torneos cargados */
        .sin-torneos {
            text-align: center;
            color: #a0a0a0;
            font-size: 16px;
            padding: 40px 0;
        }

        /* RESPONSIVE */
        @media (max-width: 650px) {
            .torneo-card {
                padding: 24px 15px;
            }
            .torneo-card h2 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<!-- NAVBAR GLOBAL -->
<div th:replace="~{fragments/nav :: barraNavegacion}"></div>


<!-- LISTADO DINÁMICO DE TORNEOS -->
<main class="contenedor">
    <h1> ELIGE UN TORNEO </h1>
    <!-- Itera la lista enviada desde el controlador -->
    <a th:each="torneo : ${torneos}"
       th:href="@{/administrarTorneoAdmin/{idTorneo}(idTorneo=${torneo.id})}"
       class="torneo-link">
        <div class="torneo-card">
            <h2 th:text="${torneo.nombre}">Torneo 1</h2>
        </div>
    </a>

    <!-- Si la lista está vacía -->
    <div th:if="${#lists.isEmpty(torneos)}" class="sin-torneos">
        <p>No hay torneos disponibles en este momento.</p>
    </div>
</main>

</body>
</html>
