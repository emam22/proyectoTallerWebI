<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <link rel="stylesheet" th:href="@{/css/app.css?v=4}"/>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>System TOR</title>

    <!-- Boostrap core css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- custom style -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png?v=2}" />
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #1f1f1f;
            color: white;
            min-height: 100vh;
            padding: 80px 20px 20px;
        }
        .container-form{
            display: flex;
            flex-direction: column;
            gap: 32px;
        }
        .avanzar-fecha h1 {
            color: #b6ff00;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .form-signin-heading {
            margin: 0;
            text-align: center;
        }

        .login-titulo {
            color: #b6ff00;
            font-size: 26px;
            font-weight: bold;
        }

        .login-slogan {
            color: #cccccc;
            font-size: 14px;
            font-style: italic;
            line-height: 1.4;
            text-align: center;
        }

        #loginbox {
            margin-top: 20px;
            padding: 28px;
            background: #2c2c2c;
            border: 1px solid #555;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .login-label {
            color: #cccccc;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .login-campo {
            display: flex;
            flex-direction: column;
        }

        .login-separador {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #999999;
            font-size: 13px;
            text-align: center;
        }

        .login-separador::before,
        .login-separador::after {
            content: "";
            flex: 1;
            border-top: 1px solid #555;
        }

        .colorgraph {
            border: 0;
            border-top: 1px solid #b6ff00;
            opacity: 0.6;
            margin: 0;
        }

        .form-control {
            background: #2c2c2c;
            border: 1px solid #555;
            border-radius: 8px;
            color: #ffffff;
            padding: 12px 14px;
        }

        .form-control:focus {
            background: #2c2c2c;
            border-color: #b6ff00;
            box-shadow: 0 0 0 3px rgba(182, 255, 0, 0.15);
            color: #ffffff;
            outline: none;
        }

        .form-control::placeholder {
            color: #999999;
        }

        #btn-login {
            width: 100%;
            padding: 12px;
            background-color: #b6ff00;
            color: black;
            border: solid 1px white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.25s ease;
        }

        #btn-login:hover:not(:disabled) {
            background-color: #d9ff66;
            color: #000000;
        }

        #btn-login:disabled {
            background-color: #444444;
            border-color: #555555;
            color: #999999;
            cursor: not-allowed;
            opacity: 1;
        }

        #btn-register {
            display: inline-block;
            width: 100%;
            margin-top: 16px;
            padding: 10px;
            border: 1px solid #b6ff00;
            border-radius: 8px;
            color: #b6ff00;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        #btn-register:hover {
            background: rgba(182, 255, 0, 0.15);
            color: #ffffff;
        }

        .alert-danger {
            background: rgba(255, 51, 51, 0.15);
            border: 1px solid #ff3333;
            border-radius: 8px;
            color: #ff6666;
            margin: 0;
            padding: 10px 12px;
            text-align: center;
        }

        .logo-login-columna {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 50px;
            padding: 0 15px;
        }
        .logo-login-grande {
            width: 100%;
            max-width: 440px;
            height: auto;
        }

        .logo-clientes-bloque {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 440px;
        }

        .logo-clientes-titulo {
            margin: 0;
            color: #999999;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.6px;
            text-align: center;
            text-transform: uppercase;
        }

        .logo-clientes {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px 22px;
            width: 100%;
            max-width: 440px;
        }

        .cliente-logo {
            display: block;
            width: auto;
            height: 34px;
            max-width: 132px;
            color: #999999;
            opacity: 0.5;
            filter: grayscale(1);
        }
        @media (max-width: 800px) {

            body {
                padding: 70px 10px 10px;
            }

            #loginbox {
                margin-top: 10px;
                padding: 18px;
            }

            .logo-login-columna {
                margin-top: 24px;
            }

            .logo-login-grande {
                max-width: 220px;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR GLOBAL -->
<div th:replace="~{fragments/nav :: barraNavegacion}"></div>

<main role="main" class="container">

        <div class="container">
            <div class="row align-items-center justify-content-center">
                <div id="loginbox" class="mainbox col-md-6 col-sm-10">
                <form class="container-form" action="#" th:action="@{/validar-login}" method="POST" th:object="${datosLogin}">
                    <h3 class="form-signin-heading login-titulo">System TOR</h3>
                    <hr class="colorgraph">
                    <p class="form-signin-heading login-slogan">Simul&aacute;, gestion&aacute; y gan&aacute; tu torneo</p>

                    <div class="login-campo">
                        <label class="login-label" for="email">Email</label>
                        <input th:field="*{email}" id="email" type="email" class="form-control" placeholder="usuario@unlam.edu.ar" autocomplete="username" required />
                    </div>

                    <div class="login-campo">
                        <label class="login-label" for="password">Contrase&ntilde;a</label>
                        <input th:field="*{password}" type="password" id="password" class="form-control" placeholder="Ingres&aacute; tu contrase&ntilde;a" autocomplete="current-password" required />
                    </div>

                    <button id="btn-login" class="btn btn-lg btn-primary btn-block" Type="Submit"
                        disabled>Login</button>

                    <p th:if="${error != null}" class="alert alert-danger" th:text="'Error ' + ${error}">
                    </p>

                    <div class="login-separador">&iquest;No ten&eacute;s cuenta?</div>
                </form>
                <a id="btn-register" href="nuevo-usuario">Registrarme</a>
                </div>
                <div class="col-md-6 col-sm-10 logo-login-columna">
                    <img class="logo-login-grande" th:src="@{/img/isotipo.png?v=2}" alt="System TOR" />

                    <div class="logo-clientes" aria-label="Clientes que usan System TOR">
                        <svg class="cliente-logo" viewBox="0 0 118 32" role="img" aria-label="Club Norte">
                            <path d="M6 4h16v10c0 6-8 11-8 11S6 20 6 14z" fill="none" stroke="currentColor" stroke-width="2"/>
                            <path d="M11 9h6l-6 8h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            <text x="30" y="14" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.2">CLUB</text>
                            <text x="30" y="25" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.2">NORTE</text>
                        </svg>

                        <svg class="cliente-logo" viewBox="0 0 118 32" role="img" aria-label="Liga Sur">
                            <circle cx="14" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                            <path d="M14 9l2 4 4 .5-3 3 .8 4-3.8-2-3.8 2 .8-4-3-3 4-.5z" fill="currentColor"/>
                            <text x="30" y="14" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.2">LIGA</text>
                            <text x="30" y="25" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.2">SUR</text>
                        </svg>

                        <svg class="cliente-logo" viewBox="0 0 118 32" role="img" aria-label="Deportivo Ribera">
                            <path d="M4 11c3-4 6 4 9 0s6 4 9 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M4 21c3-4 6 4 9 0s6 4 9 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <text x="30" y="14" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.2">DEP.</text>
                            <text x="30" y="25" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.2">RIBERA</text>
                        </svg>

                        <svg class="cliente-logo" viewBox="0 0 118 32" role="img" aria-label="Union Federal">
                            <path d="M6 5v10a8 8 0 0016 0V5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M11 5v10a3 3 0 006 0V5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <text x="30" y="14" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.2">UNION</text>
                            <text x="30" y="25" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.2">FEDERAL</text>
                        </svg>

                        <svg class="cliente-logo" viewBox="0 0 118 32" role="img" aria-label="Torneo Metro">
                            <path d="M14 4l9 5v10l-9 5-9-5V9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M14 10l4 3-1.5 5h-5L10 13z" fill="currentColor"/>
                            <text x="30" y="14" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.2">TORNEO</text>
                            <text x="30" y="25" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="1.2">METRO</text>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- /.container -->

    <!-- Boostrap core js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

    <script type="module" th:src="@{js/login.js}"></script>
</body>

</html>
