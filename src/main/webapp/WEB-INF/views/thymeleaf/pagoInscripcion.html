<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción al Torneo - Pago</title>

    <style>
        .container {
            max-width: 600px;
            margin: 40px auto;
            font-family: Arial, sans-serif;
        }
        #paymentBrick_container {
            margin-top: 20px;
        }
    </style>

    <link rel="stylesheet" th:href="@{/css/estilos-generales.css}">

    <!-- 1. El SDK de Mercado Pago DEBE cargarse antes de cualquier script que lo use -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>
<body>
<div class="container">
    <h2>Abonar Inscripción al Torneo</h2>
    <p>Monto a abonar: <strong>$5.000,00</strong></p>

    <!-- Contenedor donde Mercado Pago monta el formulario -->
    <div id="paymentBrick_container"></div>
</div>

<!-- 2. Tu archivo JS externo al final del body -->
<script th:src="@{/js/pagoBrick.js?v=3}"></script>
</body>
</html>
